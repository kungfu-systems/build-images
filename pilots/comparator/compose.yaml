name: ${COMPARATOR_PROJECT_NAME:-kungfu-comparator-pilot}

services:
  runner:
    image: ghcr.io/kungfu-systems/build-images/kungfu-verify@sha256:cb6d939d567c129903d6e3ad858e2c09a9475b3b8f81b1aad10279d0e63a920d
    platform: linux/amd64
    command: ["sleep", "infinity"]
    stop_grace_period: 5s
    profiles: ["aeron", "clickhouse", "postgres", "kungfu"]
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    networks: [pilot]
    mem_limit: 1g
    cpus: 1.00

  aeron:
    image: ghcr.io/kungfu-systems/build-images/aeron-native-kit@sha256:684be4100866a3908020d1f368fe1100225a1101a65e9a0ee6d4da6a94963c76
    platform: linux/amd64
    command:
      - /opt/aeron-native-kit/bin/aeron-native-harness
      - server
      - --root
      - /var/lib/aeron
      - --file-sync-level
      - "1"
      - --catalog-sync-level
      - "1"
    profiles: ["aeron"]
    read_only: true
    tmpfs:
      - /tmp:size=128m
    shm_size: 256m
    healthcheck:
      test: ["CMD", "/opt/aeron-native-kit/bin/aeron-native-harness", "health", "--root", "/var/lib/aeron"]
      interval: 1s
      timeout: 5s
      retries: 30
    security_opt:
      - no-new-privileges:true
    volumes:
      - aeron-data:/var/lib/aeron
    networks: [pilot]
    mem_limit: 2g
    cpus: 2.00

  clickhouse:
    image: ghcr.io/kungfu-systems/build-images/clickhouse-server@sha256:964dfcdf7f33ed509f50757061456618e1a13d99340e86c678130f9bd235cdc8
    platform: linux/amd64
    profiles: ["clickhouse"]
    environment:
      CLICKHOUSE_DB: pilot
      CLICKHOUSE_USER: pilot
      CLICKHOUSE_PASSWORD: pilot-local-only
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    healthcheck:
      test: ["CMD-SHELL", "test \"$(cat /proc/1/comm)\" = clickhouse-serv && clickhouse-client --user pilot --password pilot-local-only --database pilot --query 'SELECT 1'"]
      interval: 2s
      timeout: 3s
      retries: 30
    security_opt:
      - no-new-privileges:true
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    networks: [pilot]
    mem_limit: 2g
    cpus: 2.00

  postgres:
    image: postgres:18.4-bookworm@sha256:d9c83446333daec3f0588cc709adb80c26090b7f9f0f7ec8d43c243385d79818
    platform: linux/amd64
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: pilot
      POSTGRES_USER: pilot
      POSTGRES_PASSWORD: pilot-local-only
    healthcheck:
      test: ["CMD-SHELL", "test \"$(cat /proc/1/comm)\" = postgres && pg_isready -U pilot -d pilot"]
      interval: 2s
      timeout: 3s
      retries: 30
    security_opt:
      - no-new-privileges:true
    volumes:
      - postgres-data:/var/lib/postgresql
    networks: [pilot]
    mem_limit: 2g
    cpus: 2.00

  kungfu:
    image: ${KUNGFU_CLI_IMAGE:-kungfu-package-input-required}
    pull_policy: never
    build:
      context: ./images/kungfu
      args:
        KUNGFU_CLI_PACKAGE_SHA256: ${KUNGFU_CLI_PACKAGE_SHA256:-INPUT_REQUIRED}
        KUNGFU_CLI_VERSION: ${KUNGFU_CLI_VERSION:-INPUT_REQUIRED}
        KUNGFU_CLI_SOURCE_SHA: ${KUNGFU_CLI_SOURCE_SHA:-INPUT_REQUIRED}
    platform: linux/amd64
    command: ["sh", "-c", "trap 'exit 0' TERM INT; while :; do sleep 30; done"]
    profiles: ["kungfu"]
    read_only: true
    tmpfs:
      - /tmp:size=128m
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    volumes:
      - kungfu-data:/var/lib/kungfu
    networks: [pilot]
    mem_limit: 2g
    cpus: 2.00

networks:
  pilot:
    internal: true

volumes:
  aeron-data:
  clickhouse-data:
  postgres-data:
  kungfu-data:
