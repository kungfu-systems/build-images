schema = 1
name = "latex-pdf-builder"
contract_major = 1
platform = "linux-x64"
publish = true

[base]
image = "node24-pnpm"

[runner]
profile = "github-hosted-ubuntu-24.04"
self_hosted_required = false

[build]
context = "."
dockerfile = "Dockerfile"
test_commands = [
  "latexmk -version",
  "biber --version",
  "test \"$(pnpm --version)\" = \"11.7.0\"",
  "test -n \"$(kpsewhich sfrm1000.pfb)\"",
  "cp -R /opt/kungfu/latex-pdf-builder-smoke /tmp/latex-smoke && cd /tmp/latex-smoke && pnpm run pdf && test -s _build/main.pdf && sha256sum _build/main.pdf",
]
