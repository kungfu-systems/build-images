schema = 1
name = "opencode-ci"
contract_major = 1
platform = "linux-x64"
publish = true

[base]
image = "kungfu-verify"

[runner]
profile = "github-hosted-ubuntu-24.04"
self_hosted_required = false

[build]
context = "."
dockerfile = "Dockerfile"
test_commands = [
  "test \"$(opencode --version)\" = \"1.18.5\"",
  "node --version",
  "python3 --version",
  "git --version",
  "jq --version",
  "test \"$(id -u)\" -ne 0",
  "opencode-ci-run --help",
  "opencode-ci-verify --help",
]

[lock]
status = "pending-first-publish"
reason = "The image is new on the v1.3 line and has no accepted public digest yet."
