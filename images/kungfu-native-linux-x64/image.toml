schema = 1
name = "kungfu-native-linux-x64"
contract_major = 1
platform = "linux-x64"
publish = true

[base]
image = "kungfu-verify"

[runner]
profile = "kungfu-build-v4-linux-x64"
self_hosted_required = false

[lock]
status = "pending-first-publish"
reason = "The first Buildchain v1.3 alpha publish must produce the immutable GHCR digest used by the fresh-consumer source-build smoke."

[build]
context = "."
dockerfile = "Dockerfile"
test_commands = [
  "/opt/kungfu-native-source-build/tests/smoke.sh",
]
