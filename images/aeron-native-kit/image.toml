schema = 1
name = "aeron-native-kit"
contract_major = 1
platform = "linux-x64"
publish = true

[runner]
profile = "github-hosted-ubuntu-24.04"
self_hosted_required = false

[build]
context = "."
dockerfile = "Dockerfile"
test_commands = [
  "/opt/aeron-native-kit/bin/aeron-native-harness version",
  "/opt/aeron-native-kit/bin/aeron-native-harness ipc --root /tmp/aeron-kit-smoke --warmup 100 --messages 500 --payload 64 --rate 10000 --histogram /tmp/aeron-kit-smoke.hlog",
  "test -s /tmp/aeron-kit-smoke.hlog",
]

[lock]
status = "pending-first-publish"
reason = "The native qualification plan must bind the first reviewed GHCR digest from an earlier alpha."
