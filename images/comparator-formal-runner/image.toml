schema = 1
name = "comparator-formal-runner"
contract_major = 1
platform = "linux-x64"
publish = true

[base]
image = "kungfu-verify"

[runner]
profile = "github-hosted-ubuntu-24.04"
self_hosted_required = false

[lock]
status = "pending-first-publish"
reason = "The formal comparator runner has not completed its first Buildchain publish transaction."

[build]
context = "."
dockerfile = "Dockerfile"
test_commands = [
  "/opt/formal-performance/tests/smoke.sh",
]
