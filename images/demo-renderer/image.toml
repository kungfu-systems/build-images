schema = 1
name = "demo-renderer"
contract_major = 1
platform = "linux-x64"
publish = true

[runner]
profile = "github-hosted-ubuntu-24.04"
self_hosted_required = false

[build]
context = "."
dockerfile = "Dockerfile"
test_commands = [
  "test \"$(node --version)\" = \"v24.0.0\"",
  "test \"$(demo-renderer --version)\" = \"1.2.0\"",
  "test \"$(node -p 'require(\"/opt/kungfu/demo-renderer/node_modules/@xterm/headless/package.json\").version')\" = \"5.5.0\"",
  "ffmpeg -hide_banner -version | grep -F 'ffmpeg version'",
  "ffprobe -hide_banner -version | grep -F 'ffprobe version'",
  "test \"$(id -u)\" -ne 0",
  "fc-match 'DejaVu Sans Mono' | grep -F 'DejaVuSansMono.ttf'",
  "test -s /opt/kungfu/demo-renderer/licenses/DejaVu-fonts.copyright",
  "test -s /opt/kungfu/demo-renderer/terminal-runtime-inventory.json",
  "bash /opt/kungfu/demo-renderer/tests/smoke.sh",
]

[lock]
status = "pending-first-publish"
reason = "The reusable renderer is new on the v1.3 line and has no accepted public digest yet."
