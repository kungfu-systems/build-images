name: Comparator Kungfu Package Qualification

on:
  workflow_call:
    inputs:
      package_artifact_name:
        description: Actions artifact containing kungfu-episodes-cli-linux-x64.tar.gz
        required: true
        type: string
      package_sha256:
        description: Exact SHA-256 of kungfu-episodes-cli-linux-x64.tar.gz
        required: true
        type: string
      package_version:
        description: Version recorded in the comparator environment manifest
        required: true
        type: string
      source_sha:
        description: Exact 40-character source commit used to build the package
        required: true
        type: string
      build_images_ref:
        description: Reviewed immutable build-images tag or commit containing the package consumer
        required: true
        type: string
      build_images_sha:
        description: Exact 40-character build-images commit resolved by build_images_ref
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  qualify:
    name: kungfu-package-3x21
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out package consumer
        uses: actions/checkout@v5
        with:
          repository: kungfu-systems/build-images
          ref: ${{ inputs.build_images_ref }}
          path: build-images
          persist-credentials: false

      - name: Verify exact package-consumer source
        working-directory: build-images
        env:
          EXPECTED_BUILD_IMAGES_SHA: ${{ inputs.build_images_sha }}
        run: |
          set -euo pipefail
          [[ "${EXPECTED_BUILD_IMAGES_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${EXPECTED_BUILD_IMAGES_SHA}"

      - name: Download prebuilt Kungfu CLI package
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.package_artifact_name }}
          path: package-input

      - name: Stage and verify package input
        env:
          EXPECTED_SHA256: ${{ inputs.package_sha256 }}
        run: |
          set -euo pipefail
          package_count=$(find package-input -type f -name 'kungfu-episodes-cli-linux-x64.tar.gz' -print | wc -l | tr -d ' ')
          test "$package_count" -eq 1
          package=$(find package-input -type f -name 'kungfu-episodes-cli-linux-x64.tar.gz' -print -quit)
          echo "${EXPECTED_SHA256}  ${package}" | sha256sum -c -
          install -m 0644 "${package}" build-images/pilots/comparator/images/kungfu/kungfu-episodes-cli-linux-x64.tar.gz

      - name: Verify package metadata and materialize the frozen Phase B plan
        working-directory: build-images
        env:
          PACKAGE_SHA256: ${{ inputs.package_sha256 }}
          PACKAGE_VERSION: ${{ inputs.package_version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          PACKAGE_EVIDENCE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 pilots/comparator/scripts/materialize_kungfu_phase_b.py \
            --package-sha256 "${PACKAGE_SHA256}" \
            --version "${PACKAGE_VERSION}" \
            --source-sha "${SOURCE_SHA}" \
            --evidence-url "${PACKAGE_EVIDENCE_URL}" \
            --output pilots/comparator/.artifacts/materialized/kungfu-phase-b-v1.json \
            --execute
          python3 pilots/comparator/scripts/comparator_qualification.py validate-plan \
            --plan pilots/comparator/.artifacts/materialized/kungfu-phase-b-v1.json

      - name: Run disposable unscored Kungfu package smoke
        working-directory: build-images
        env:
          KUNGFU_CLI_ARTIFACT_NAME: ${{ inputs.package_artifact_name }}
          KUNGFU_CLI_PACKAGE_SHA256: ${{ inputs.package_sha256 }}
          KUNGFU_CLI_VERSION: ${{ inputs.package_version }}
          KUNGFU_CLI_SOURCE_SHA: ${{ inputs.source_sha }}
          KUNGFU_CLI_EVIDENCE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash pilots/comparator/scripts/pilot.sh smoke kungfu --execute

      - name: Run the frozen Kungfu Phase B qualification
        working-directory: build-images
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=no)"
          python3 pilots/comparator/scripts/comparator_qualification.py run \
            --plan pilots/comparator/.artifacts/materialized/kungfu-phase-b-v1.json \
            --execute

      - name: Verify the retained qualification bundle offline
        working-directory: build-images
        run: |
          set -euo pipefail
          bundle="$(find pilots/comparator/.artifacts/qualification/kungfu-phase-b-v1 \
            -mindepth 1 -maxdepth 1 -type d -name 'qual-kungfu-*' -print -quit)"
          test -n "${bundle}"
          python3 pilots/comparator/scripts/comparator_qualification.py \
            verify-bundle --bundle "${bundle}"

      - name: Upload package smoke and qualification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: comparator-kungfu-phase-b-${{ github.run_id }}
          path: build-images/pilots/comparator/.artifacts/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
