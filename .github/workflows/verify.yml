name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "chore/**"
      - "dev/**"
      - "dev/v*/v*"
      - "alpha/v*/v*"
      - "release/**"
      - "release/v*/v*"
      - "publish-gate/major"
      - "major-gate"
  workflow_dispatch:
    inputs:
      buildchain-ref:
        description: "Temporary Buildchain train or exact SHA for trusted validation"
        required: false
        default: ""
      delivery-request-json:
        description: "Exact source-qualified development delivery request; empty runs verification"
        required: false
        default: ""

permissions:
  actions: read
  contents: read
  issues: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.delivery-request-json != '' && 'build-images-v4-dev-delivery' || format('build-images-verify-{0}', github.ref) }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && inputs.delivery-request-json != '') }}

jobs:
  opencode_ci:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.delivery-request-json != '') }}
    name: OpenCode CI deterministic fixture
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate OpenCode CI sources
        run: |
          python3 -m py_compile \
            images/opencode-ci/bin/opencode-ci-verify \
            images/opencode-ci/tests/mock-openai.py
          bash -n \
            images/opencode-ci/bin/opencode-ci-run \
            images/opencode-ci/tests/integration.sh

      - name: Build and verify OpenCode CI image
        run: bash images/opencode-ci/tests/integration.sh

  buildchain:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.delivery-request-json != '') }}
    uses: kungfu-systems/buildchain/.github/workflows/build.yml@v4-alpha
    permissions:
      actions: read
      contents: read
      issues: write
      id-token: write
    with:
      buildchain-channel: auto
      buildchain-ref: ${{ inputs.buildchain-ref || '' }}
      runner-preset: custom
      platforms-json: >-
        [{"id":"linux-x64","name":"Linux x64","runner":"[\"ubuntu-24.04\"]"}]
      setup-node: true
      node-version: "24"
      install-command: corepack enable && pnpm install --frozen-lockfile
      verify-command: corepack enable && pnpm run check
      require-install: true
      require-build: false
      require-verify: true
      artifact-name: build-images-verify
      artifact-name-template: "{artifact}-{platform}-{shortSha}"
      artifact-paths: |
        images.lock.json
        .buildchain/kfd
      artifact-retention-days: 7
      publish-channel: >-
        ${{ (startsWith(github.ref_name, 'release/') || startsWith(github.base_ref, 'release/')) && 'release' ||
            (startsWith(github.ref_name, 'alpha/') || startsWith(github.base_ref, 'alpha/')) && 'alpha' || 'none' }}
      buildchain-contract-drift-issue-mode: compatible-and-breaking

  check:
    name: check
    needs:
      - buildchain
      - opencode_ci
    if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.delivery-request-json != '') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require Buildchain verification and expected channel
        shell: bash
        env:
          BUILDCHAIN_RESULT: ${{ needs.buildchain.result }}
          OPENCODE_CI_RESULT: ${{ needs.opencode_ci.result }}
          RESOLVED_CHANNEL: ${{ needs.buildchain.outputs.buildchain-channel }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$BUILDCHAIN_RESULT" != "success" ]; then
            echo "::error::Buildchain verification result was $BUILDCHAIN_RESULT"
            exit 1
          fi
          if [ "$OPENCODE_CI_RESULT" != "success" ]; then
            echo "::error::OpenCode CI fixture result was $OPENCODE_CI_RESULT"
            exit 1
          fi

          expected="alpha"
          case "${GITHUB_REF_NAME}|${BASE_REF}" in
            release/*\|*|*\|release/*) expected="stable" ;;
          esac
          if [ "$RESOLVED_CHANNEL" != "$expected" ]; then
            echo "::error::Buildchain channel was $RESOLVED_CHANNEL, expected $expected"
            exit 1
          fi

  deliver:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.delivery-request-json != '' }}
    uses: kungfu-systems/buildchain/.github/workflows/dev-pr-auto-merge.yml@v4-alpha
    permissions:
      actions: write
      contents: write
      pull-requests: write
      checks: read
      statuses: write
    secrets:
      github-token: ${{ secrets.BUILDCHAIN_PROMOTION_TOKEN }}
    with:
      buildchain-ref: ${{ inputs.buildchain-ref || 'v4-alpha' }}
      target-branch: dev/v1/v1.3
      expected-pr-number: ${{ fromJSON(inputs.delivery-request-json).pullRequestNumber }}
      expected-head-sha: ${{ fromJSON(inputs.delivery-request-json).sourceHead }}
      source-workflow-run-id: ${{ fromJSON(inputs.delivery-request-json).sourceWorkflowRunId }}
      source-workflow-id: verify.yml
      delivery-warrant-mode: required
      delivery-class: non-native-fast
      source-identity-root: ${{ fromJSON(inputs.delivery-request-json).sourceIdentityRoot }}
      source-patch-root: ${{ fromJSON(inputs.delivery-request-json).sourcePatchRoot }}
      plan-root: ${{ fromJSON(inputs.delivery-request-json).planRoot }}
      closure-root: ${{ fromJSON(inputs.delivery-request-json).closureRoot }}
      dependency-root: ${{ fromJSON(inputs.delivery-request-json).dependencyRoot }}
      toolchain-root: ${{ fromJSON(inputs.delivery-request-json).toolchainRoot }}
      affected-paths-json: ${{ toJSON(fromJSON(inputs.delivery-request-json).affectedPaths) }}
      required-status-checks: check
      ready-label: ready
      landing-mode: auto
      dry-run: false
